openapi: 3.1.0
info:
  title: API du moteur audio Mixette
  version: 0.1.0
  description: >
    Contrat HTTP et WebSocket du moteur SuperCollider. Écoute sur 127.0.0.1 uniquement
    (port 3100, variable MIXETTE_ENGINE_PORT). Les corps de requête sont stricts : un champ
    inconnu ou une valeur hors plage renvoie 400 VALIDATION. Toute mutation exige un moteur
    en état running (409 ENGINE_NOT_RUNNING sinon). Les routes de presets et de bancs d'essai
    sont décrites par leurs tâches respectives.

    Paramètres de traitement. Chaque argument de contrôle de chaque UGen utilisé par un étage de
    source ou de sortie est un champ du contrat, avec sa plage et son défaut ; les défauts reproduisent
    le son précédent. Seuls les arguments qui portent le signal (in, control, bus) ne sont pas des
    paramètres. Les étages sont remplacés par leur objet complet (champ manquant ou inconnu : 400
    VALIDATION). Ancien contrat refusé : ratio, makeupDb et ceilingDb du clipper n'existent plus
    (remplacés par slopeAbove, mul et lo/hi). Chaque étage porte controlLag (lissage Lag.kr de ses
    contrôles continus, défaut 0 : aucun lissage). Les sessions de version 2 sont refusées (version 3).

    Noms de contrôles de SynthDef (pour un futur /n_set direct). Le nom du contrôle est le nom du
    champ. Une SynthDef qui porte plusieurs objets du contrat préfixe le champ par le nom de l'objet,
    premier caractère du champ en majuscule : mx_in_<largeur> (input, inputCompressor : inputGain,
    inputCompressorThresholdDb), mx_dyn_<largeur> (low, mid, high, crossover : lowThresholdDb,
    crossoverLowMidFreq) et la SynthDef de sortie (mix, eq, infraHpf, sideHpf, clipper, limiter,
    compressor : mixVolume, eqLowFreq, limiterDurMs). Les autres SynthDefs de source (eq, hp, lp, pitch,
    mix) portent un seul objet : champ seul. Le champ model n'est pas un contrôle : il choisit la
    SynthDef (BHiPass, RHPF, BHiPass4 ; BLowPass, RLPF, BLowPass4, MoogFF ; Compander, CompanderD,
    FaustRMS). Les conversions (dB vers amplitude, 0..1 vers Hz, demi-tons vers rapport, ms vers s) sont
    dans les SynthDefs. compressor.fadeSeconds est le contrôle compressorFadeSeconds de l'écrivain de
    sortie.

    Arguments fixés à la création du UGen (pitch.windowSize, limiter.durMs) : PitchShift.schelp et
    Limiter.schelp précisent qu'ils ne peuvent pas être modulés ; leur changement recrée le Synth
    (opération de structure traitée par sclang). VarLag.warp et VarLag.curvature du fondu de sortie sont fixés à la construction du SynthDef (rampe linéaire) : Filter.sc évalue warp dans sclang pour choisir l'implémentation, il ne peut donc pas être un contrôle. Tous les autres changements de valeur sont des
    réglages de contrôles.

    Vumètres : replyRate (10 Hz) et peakLag (0.25 s) de SendPeakRMS sont des propriétés de mesure fixes, pas des paramètres de traitement (décision du contrôleur) ; le nom de commande et l'identifiant de réponse sont internes.

    Déplacement d'une source (PATCH de firstChannel ou width) : la nouvelle chaîne entre en fondu (0 vers 1) pendant que l'ancienne sort (1 vers 0), sur la même durée, en amplitude linéaire complémentaire (somme des gains égale à 1 : gain unitaire pour un matériau corrélé). Le vumètre de l'ancienne chaîne est coupé pendant le chevauchement.

    Retrait d'une source (DELETE, changement de largeur ou de canaux, remplacement d'un preset) : le
    niveau de l'étage mix descend à zéro en au moins une période matérielle avant la libération du
    nœud (Server-Command-Reference, /n_free : un nœud non silencieux libéré peut produire un clic).
servers:
  - url: http://127.0.0.1:3100
tags:
  - name: Moteur
  - name: Sources
  - name: Sorties

paths:
  /api/state:
    get:
      tags: [Moteur]
      summary: État complet publié par stateChanged
      responses:
        '200': { description: État, content: { application/json: { schema: { $ref: '#/components/schemas/State' } } } }
  /api/parameters:
    get:
      tags: [Moteur]
      summary: Catalogue des paramètres (plages, défauts, unités, libellés), moteur arrêté ou démarré
      description: "Bornes, options et défauts tirés des schémas du contrat ; libellés et unités tenus dans src/contract/descriptors.js. Aucune valeur n'est recopiée côté client. appliesTo masque un champ quand la condition (largeur, modèle) n'est pas remplie."
      responses:
        '200': { description: Catalogue, content: { application/json: { schema: { $ref: '#/components/schemas/ParameterCatalog' } } } }
  /api/engine:
    get:
      tags: [Moteur]
      summary: État du moteur
      responses:
        '200': { $ref: '#/components/responses/EngineState' }
  /api/engine/start:
    post:
      tags: [Moteur]
      summary: Lit l'horloge audio de TimoxVasio (409 TIMOXVASIO_NOT_READY s'il n'est pas prêt), démarre sclang et scsynth puis restaure la session
      description: >
        409 ENGINE_RESTART_REQUIRED si la session persistée dépasse le dimensionnement de scsynth (nombre
        maximal de sources ou largeur maximale) : le démarrage est refusé avant tout lancement de sclang.
        Un refus de démarrage annoncé par sclang (ligne MX-ENGINE-FAIL : garde de bus, échec du graphe)
        renvoie 502 SC_COMMAND_FAILED avec la cause dans le message.
      responses:
        '200': { $ref: '#/components/responses/EngineState' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/engine/stop:
    post:
      tags: [Moteur]
      summary: Arrête scsynth et sclang
      responses:
        '200': { $ref: '#/components/responses/EngineState' }
        '409': { $ref: '#/components/responses/Error' }
  /api/engine/restart:
    post:
      tags: [Moteur]
      summary: Arrête puis démarre le moteur
      responses:
        '200': { $ref: '#/components/responses/EngineState' }
        '409': { $ref: '#/components/responses/Error' }
  /api/engine/runtime:
    get:
      tags: [Moteur]
      summary: Dernier statut d'exécution reçu de sclang (null moteur arrêté)
      responses:
        '200':
          description: Statut ou null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Runtime'
                  - type: 'null'
  /api/engine/node-tree:
    get:
      tags: [Moteur]
      summary: Arbre des nœuds du serveur (/g_queryTree)
      parameters:
        - name: controls
          in: query
          required: false
          description: "true : /g_queryTree avec drapeau 1, chaque Synth porte ses contrôles (nom et valeur courante) ; false par défaut."
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200': { description: Arbre, content: { application/json: { schema: { $ref: '#/components/schemas/NodeTree' } } } }
        '409': { $ref: '#/components/responses/Error' }

  /api/sources:
    get:
      tags: [Sources]
      summary: Liste des sources
      responses:
        '200':
          description: Sources
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Source' } } } }
    post:
      tags: [Sources]
      summary: Crée une source avec le traitement par défaut
      description: >
        Les options de scsynth (bus audio, tampons d'interconnexion, nœuds, mémoire) sont calculées au
        démarrage du moteur pour un dimensionnement donné (nombre maximal de sources, largeur maximale)
        et ne peuvent plus croître ensuite. Une création au-delà de ce dimensionnement est refusée par
        409 ENGINE_RESTART_REQUIRED, état inchangé. La première source d'une largeur donnée construit
        les SynthDefs de cette largeur dans sclang ; la requête reste ouverte pendant la construction
        (environ 9 s mesurées pour la largeur 256, 0,84 s pour 64), la file de commandes sclang
        attendant jusqu'à 120 s l'acquittement avant 502 SC_COMMAND_FAILED.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourceCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/Source' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sources/{id}:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    get:
      tags: [Sources]
      summary: Une source
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Sources]
      summary: Modifie le nom ou les canaux ; un changement de canaux recrée la source dans le moteur ; au-delà du dimensionnement de scsynth, 409 ENGINE_RESTART_REQUIRED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourcePatch' } } } }
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Sources]
      summary: Supprime la source
      responses:
        '204': { description: Supprimée }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sources/{id}/processing/{stage}:
    parameters:
      - { $ref: '#/components/parameters/SourceId' }
      - name: stage
        in: path
        required: true
        schema: { type: string, enum: [mix, input, inputCompressor, eq, hp, lp, pitch] }
    put:
      tags: [Sources]
      summary: Remplace un étage de traitement (objet complet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SourceMix'
                - $ref: '#/components/schemas/SourceInput'
                - $ref: '#/components/schemas/CompBand'
                - $ref: '#/components/schemas/SourceEq'
                - $ref: '#/components/schemas/Hp'
                - $ref: '#/components/schemas/Lp'
                - $ref: '#/components/schemas/Pitch'
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sources/{id}/processing/bandCompressor/{band}:
    parameters:
      - { $ref: '#/components/parameters/SourceId' }
      - name: band
        in: path
        required: true
        schema: { type: string, enum: [low, mid, high, crossover] }
    put:
      tags: [Sources]
      summary: "Remplace une bande du compresseur multibande (low, mid, high : CompBand) ou ses filtres de répartition (crossover)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CompBand'
                - $ref: '#/components/schemas/Crossover'
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sources/{id}/processing/hp/reset:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [Sources]
      summary: Rétablit les valeurs par défaut du filtre passe-haut
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sources/{id}/processing/lp/reset:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [Sources]
      summary: Rétablit les valeurs par défaut du filtre passe-bas
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sources/{id}/processing/lp/reset-state:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [Sources]
      summary: Réinitialise l'état interne du filtre MoogFF (400 VALIDATION pour tout autre modèle)
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/outputs/cue/copy-master:
    post:
      tags: [Sorties]
      summary: Copie tous les étages de la sortie master vers la sortie cue
      responses:
        '200': { $ref: '#/components/responses/Output' }
        '409': { $ref: '#/components/responses/Error' }
  /api/outputs/{output}/{stage}:
    parameters:
      - { $ref: '#/components/parameters/Output' }
      - name: stage
        in: path
        required: true
        schema: { type: string, enum: [mix, eq, infraHpf, sideHpf, clipper, limiter, compressor] }
    put:
      tags: [Sorties]
      summary: Remplace un étage de sortie (objet complet) ; modèle indisponible, 409 MODEL_UNAVAILABLE et état inchangé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OutputMix'
                - $ref: '#/components/schemas/OutputEq'
                - $ref: '#/components/schemas/InfraHpf'
                - $ref: '#/components/schemas/SideHpf'
                - $ref: '#/components/schemas/Clipper'
                - $ref: '#/components/schemas/Limiter'
                - $ref: '#/components/schemas/OutputCompressor'
      responses:
        '200': { $ref: '#/components/responses/Output' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/outputs/{output}/processing-graph:
    parameters: [ { $ref: '#/components/parameters/Output' } ]
    get:
      tags: [Sorties]
      summary: Étages ordonnés avec modèle demandé et modèle chargé (null si indisponible ou sans modèle)
      description: >
        Les étages sont listés dans l'ordre de traversée du signal : infraHpf, sideHpf, eq,
        mix (volume), clipper, limiter, compressor. Le compresseur est le dernier étage.
      responses:
        '200':
          description: Graphe de traitement
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GraphStage' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/presets:
    get:
      tags: [Presets]
      summary: Liste des presets (identifiant, nom, date de création), triés par identifiant
      responses:
        '200': { description: Presets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PresetSummary' } } } } }
    post:
      tags: [Presets]
      summary: Enregistre la session courante (sources, réglages, Master, Cue) ; moteur arrêté ou démarré
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PresetCreate' } } }
      responses:
        '201': { description: Preset créé, content: { application/json: { schema: { $ref: '#/components/schemas/PresetSummary' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/presets/{id}:
    parameters: [ { $ref: '#/components/parameters/PresetId' } ]
    delete:
      tags: [Presets]
      summary: Supprime un preset (son identifiant n'est jamais réutilisé)
      responses:
        '204': { description: Supprimé }
        '404': { $ref: '#/components/responses/Error' }
  /api/presets/{id}/apply:
    parameters: [ { $ref: '#/components/parameters/PresetId' } ]
    post:
      tags: [Presets]
      summary: Remplace toute la session par le contenu du preset, en une seule mutation
      description: >
        Contenu validé avant tout code sclang (canaux, identifiants, modèles disponibles) : un preset invalide
        est refusé en bloc, session et fichier inchangés. Sources absentes du preset : retrait en fondu ;
        sources conservées : remplacement en fondu enchaîné (~mxReplaceSource) ; sources nouvelles : ajout en
        fondu ; puis tous les étages de Master et Cue. nextSourceSeq ne recule jamais. Moteur démarré requis.
      responses:
        '200': { description: État confirmé, content: { application/json: { schema: { $ref: '#/components/schemas/State' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/benches/compressor/run:
    post:
      tags: [Bancs]
      summary: Banc du compresseur trois bandes (3 s, signal interne, jamais vers Master ni Cue)
      description: >
        Signal interne 100 Hz + 1 kHz + 8 kHz traité par la SynthDef de compression trois bandes de largeur 2,
        réglages par défaut des bandes, dans cinq cas (aucune bande, grave, médium, aigu, toutes) ; RMS et crête
        mesurés sur bus privés. Corps vide. Moteur démarré requis ; la requête reste ouverte 3 s.
      responses:
        '200': { description: Résultats, content: { application/json: { schema: { $ref: '#/components/schemas/CompressorBenchResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/benches/eq:
    get:
      tags: [Bancs]
      summary: État du banc EQ, relu dans sclang (arrêté si le moteur est arrêté)
      responses:
        '200': { description: État, content: { application/json: { schema: { $ref: '#/components/schemas/EqBenchState' } } } }
    put:
      tags: [Bancs]
      summary: Change la méthode ou les bandes du banc EQ démarré (409 BENCH_NOT_RUNNING sinon)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EqBench' } } }
      responses:
        '200': { description: État, content: { application/json: { schema: { $ref: '#/components/schemas/EqBenchState' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/benches/eq/start:
    post:
      tags: [Bancs]
      summary: Démarre le banc EQ (bruit rose traité qui remplace Master sur les sorties 1/2) ; 409 BENCH_RUNNING s'il est déjà démarré
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EqBench' } } }
      responses:
        '200': { description: État, content: { application/json: { schema: { $ref: '#/components/schemas/EqBenchState' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/benches/eq/stop:
    post:
      tags: [Bancs]
      summary: Arrête le banc EQ et rend Master (sans effet s'il est arrêté) ; corps vide
      responses:
        '200': { description: État, content: { application/json: { schema: { $ref: '#/components/schemas/EqBenchState' } } } }
        '409': { $ref: '#/components/responses/Error' }

x-websocket:
  path: /api/ws
  description: >
    Messages JSON { type, data } diffusés à tous les clients. À la connexion, un message
    stateChanged est envoyé immédiatement.
  events:
    stateChanged:
      description: Après chaque modification de session validée ; même charge utile que GET /api/state.
      data: { $ref: '#/components/schemas/State' }
    engineStateChanged:
      description: À chaque changement d'état du moteur.
      data: { $ref: '#/components/schemas/EngineState' }
    engineRuntimeChanged:
      description: Statut d'exécution de sclang, environ une fois par seconde.
      data: { $ref: '#/components/schemas/Runtime' }
    sourceMeter:
      description: Mesure d'une source, 10 Hz.
      data: { $ref: '#/components/schemas/SourceMeter' }
    outputMeter:
      description: Mesure d'un canal de sortie, 10 Hz.
      data: { $ref: '#/components/schemas/OutputMeter' }

components:
  parameters:
    SourceId:
      name: id
      in: path
      required: true
      description: Identifiant de la forme src-<n>
      schema: { type: string, pattern: '^src-[0-9]+$' }
    PresetId:
      name: id
      in: path
      required: true
      description: Identifiant de la forme preset-<n>
      schema: { type: string, pattern: '^preset-[1-9][0-9]*$' }
    Output:
      name: output
      in: path
      required: true
      schema: { type: string, enum: [master, cue] }
  responses:
    Error:
      description: Erreur
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    EngineState:
      description: État du moteur
      content: { application/json: { schema: { $ref: '#/components/schemas/EngineState' } } }
    Source:
      description: Source confirmée
      content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } }
    Output:
      description: Sortie confirmée
      content: { application/json: { schema: { $ref: '#/components/schemas/Output' } } }
  schemas:
    PresetCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    PresetSummary:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, pattern: '^preset-[1-9][0-9]*$' }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    EqBench:
      type: object
      additionalProperties: false
      required: [method, parameters]
      properties:
        method: { type: string, enum: [legacyStack, threeBand], description: "legacyStack : ancien empilement de multiplicateurs scalaires ; threeBand : plateau grave 80 Hz, cloche 1 kHz, plateau aigu 8 kHz, ±12 dB, appliqués deux fois (source puis sortie)." }
        parameters: { $ref: '#/components/schemas/EqBenchParameters' }
    EqBenchParameters:
      type: object
      additionalProperties: false
      required: [low, mid, high]
      properties:
        low: { type: number, minimum: 0, maximum: 1 }
        mid: { type: number, minimum: 0, maximum: 1 }
        high: { type: number, minimum: 0, maximum: 1 }
    EqBenchState:
      type: object
      required: [running, method, parameters]
      properties:
        running: { type: boolean }
        method: { type: [string, 'null'], enum: [legacyStack, threeBand, null] }
        parameters:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/EqBenchParameters' }
    CompressorBenchResult:
      type: object
      required: [status, seconds, cases]
      properties:
        status: { type: string, enum: [complete, partial], description: "partial : au moins un cas sans mesure reçue." }
        seconds: { type: number }
        cases:
          type: array
          items:
            type: object
            required: [case, compressed, peakDb, rmsDb]
            properties:
              case: { type: string, enum: [none, low, mid, high, all] }
              compressed:
                type: object
                required: [low, mid, high]
                properties:
                  low: { type: boolean }
                  mid: { type: boolean }
                  high: { type: boolean }
              peakDb: { type: [number, 'null'], description: "Crête en dBFS (plancher -120), null sans mesure." }
              rmsDb: { type: [number, 'null'], description: "RMS en dBFS (plancher -120), null sans mesure." }
    ParameterCatalog:
      type: object
      required: [source, output, bench]
      properties:
        source:
          type: object
          required: [mix, input, inputCompressor, eq, hp, lp, pitch, bandCompressor]
          properties:
            mix: { $ref: '#/components/schemas/ParameterStage' }
            input: { $ref: '#/components/schemas/ParameterStage' }
            inputCompressor: { $ref: '#/components/schemas/ParameterStage' }
            eq: { $ref: '#/components/schemas/ParameterStage' }
            hp: { $ref: '#/components/schemas/ParameterStage' }
            lp: { $ref: '#/components/schemas/ParameterStage' }
            pitch: { $ref: '#/components/schemas/ParameterStage' }
            bandCompressor:
              type: object
              required: [low, mid, high, crossover]
              properties:
                low: { $ref: '#/components/schemas/ParameterStage' }
                mid: { $ref: '#/components/schemas/ParameterStage' }
                high: { $ref: '#/components/schemas/ParameterStage' }
                crossover: { $ref: '#/components/schemas/ParameterStage' }
        output:
          type: object
          description: Un ParameterStage par étage de sortie (mix, eq, infraHpf, sideHpf, clipper, limiter, compressor).
          additionalProperties: { $ref: '#/components/schemas/ParameterStage' }
        bench:
          type: object
          required: [eq]
          properties:
            eq:
              description: "Banc EQ : champs method, low, mid, high (corps de requête { method, parameters: { low, mid, high } })."
              allOf: [ { $ref: '#/components/schemas/ParameterStage' } ]
    ParameterStage:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          description: Champs dans l'ordre du schéma.
          items: { $ref: '#/components/schemas/ParameterField' }
    ParameterField:
      type: object
      required: [key, type, default, label, description, scale]
      properties:
        key: { type: string }
        type: { type: string, enum: [number, integer, boolean, enum] }
        default: {}
        label: { type: string }
        description: { type: string }
        unit: { type: string }
        scale: { type: string, enum: [linear, log] }
        min: { type: number }
        max: { type: number }
        step: { type: integer }
        options: { type: array, items: { type: string } }
        appliesTo:
          type: object
          description: "width {min, max} et/ou model [valeurs] : le champ n'est applicable que si toutes les conditions présentes sont remplies."
          properties:
            width:
              type: object
              properties:
                min: { type: integer }
                max: { type: integer }
            model:
              type: array
              items: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION, NOT_FOUND, CHANNEL_OVERLAP, CHANNEL_LIMIT, ENGINE_NOT_RUNNING, ENGINE_BUSY, ENGINE_RESTART_REQUIRED, MODEL_UNAVAILABLE, TIMOXVASIO_NOT_READY, BENCH_RUNNING, BENCH_NOT_RUNNING, SC_COMMAND_FAILED, INTERNAL]
              description: >
                VALIDATION 400, NOT_FOUND 404, CHANNEL_OVERLAP 409, CHANNEL_LIMIT 400,
                ENGINE_NOT_RUNNING 409, ENGINE_BUSY 409, ENGINE_RESTART_REQUIRED 409, MODEL_UNAVAILABLE 409, TIMOXVASIO_NOT_READY 409, BENCH_RUNNING 409, BENCH_NOT_RUNNING 409,
                SC_COMMAND_FAILED 502, INTERNAL 500.
            message: { type: string }
    State:
      type: object
      required: [engine, sources, outputs]
      properties:
        engine: { $ref: '#/components/schemas/EngineState' }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        outputs:
          type: object
          required: [master, cue]
          properties:
            master: { $ref: '#/components/schemas/Output' }
            cue: { $ref: '#/components/schemas/Output' }
    EngineState:
      type: object
      required: [status, error, scsynthPid, timoxVasio, audioClock, models]
      properties:
        status: { type: string, enum: [stopped, starting, restoring, running, stopping, failed] }
        error: { type: [string, 'null'] }
        scsynthPid: { type: [integer, 'null'] }
        timoxVasio:
          description: >
            Supervision de TimoxVasio (API 1.1, dépôt TimoxVAudioEngine). Au démarrage, le moteur lance l'hôte
            TimoxVirtualAsioEngine.exe s'il est absent (port lu dans l'événement api.ready), envoie engine.start si le
            transport est arrêté avec un pilote physique configuré, puis lit l'horloge. Il ne crée aucune route
            (TimoxVasio ajoute scsynth à son graphe) et n'arrête jamais l'hôte ni son transport. Champs null tant que le
            moteur n'a pas démarré. Refus : 409 TIMOXVASIO_NOT_READY avec la cause (version d'API, hôte injoignable,
            aucun pilote physique, transport resté arrêté, état error).
          type: object
          required: [apiUrl, apiVersion, hostPid, launchedByEngine, physicalDriverId, state]
          properties:
            apiUrl: { type: string }
            apiVersion: { type: [string, 'null'], enum: ['1.1', null] }
            hostPid: { type: [integer, 'null'] }
            launchedByEngine: { type: boolean }
            physicalDriverId: { type: [string, 'null'] }
            state: { type: [string, 'null'], enum: [stopped, running, reconfiguring, error, null] }
        audioClock:
          description: >
            Fréquence et tampon matériel imposés par TimoxVasio (GET /api/v1/state), lus au démarrage
            et appliqués à scsynth ; null moteur arrêté. Aucune surveillance : un changement de l'horloge
            TimoxVasio en cours d'exécution n'entraîne aucune action ; redémarrer le moteur pour la relire.
          oneOf:
            - type: 'null'
            - type: object
              required: [sampleRate, bufferFrames]
              properties:
                sampleRate: { type: integer, minimum: 1 }
                bufferFrames: { type: integer, minimum: 1 }
        models:
          type: object
          required: [Compander, CompanderD, FaustRMS]
          properties:
            Compander: { type: boolean }
            CompanderD: { type: boolean }
            FaustRMS: { type: boolean }
    Runtime:
      type: object
      required: [cpuAvg, cpuPeak, synths, ugens, groups, sampleRateRequested, sampleRateActual, blockSize, hardwareBufferFrames, latencyMs, lastFail]
      properties:
        cpuAvg: { type: number }
        cpuPeak: { type: number }
        synths: { type: integer }
        ugens: { type: integer }
        groups: { type: integer }
        sampleRateRequested: { type: number }
        sampleRateActual: { type: number }
        blockSize: { type: integer }
        hardwareBufferFrames: { type: integer }
        latencyMs: { type: number }
        lastFail: { type: [string, 'null'] }
    NodeTree:
      type: object
      required: [rootId, nodes]
      properties:
        rootId: { type: integer }
        nodes:
          type: array
          items:
            type: object
            required: [nodeId, parentId, order, kind]
            properties:
              nodeId: { type: integer }
              parentId: { type: integer }
              order: { type: integer }
              kind: { type: string, enum: [group, synth] }
              synthDef: { type: string }
              controls: { type: object, additionalProperties: true }
    SourceCreate:
      type: object
      additionalProperties: false
      required: [name, firstChannel, width]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        firstChannel: { type: integer, minimum: 1, maximum: 256 }
        width: { type: integer, minimum: 1, maximum: 256 }
    SourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        firstChannel: { type: integer, minimum: 1, maximum: 256 }
        width: { type: integer, minimum: 1, maximum: 256 }
    Source:
      type: object
      additionalProperties: false
      required: [id, name, firstChannel, width, processing]
      properties:
        id: { type: string, pattern: '^src-[0-9]+$' }
        name: { type: string, minLength: 1, maxLength: 60 }
        firstChannel: { type: integer, minimum: 1, maximum: 256 }
        width: { type: integer, minimum: 1, maximum: 256 }
        processing: { $ref: '#/components/schemas/SourceProcessing' }
    SourceProcessing:
      type: object
      additionalProperties: false
      required: [mix, input, inputCompressor, eq, hp, lp, pitch, bandCompressor]
      properties:
        mix: { $ref: '#/components/schemas/SourceMix' }
        input: { $ref: '#/components/schemas/SourceInput' }
        inputCompressor: { $ref: '#/components/schemas/CompBand' }
        eq: { $ref: '#/components/schemas/SourceEq' }
        hp: { $ref: '#/components/schemas/Hp' }
        lp: { $ref: '#/components/schemas/Lp' }
        pitch: { $ref: '#/components/schemas/Pitch' }
        bandCompressor: { $ref: '#/components/schemas/BandCompressor' }
    BandCompressor:
      type: object
      description: "Compresseur trois bandes : trois compresseurs Compander (low, mid, high) et les filtres de répartition LR4 (crossover). Les trois bandes et la répartition sont portées par une seule SynthDef (mx_dyn_<largeur>) ; contrôles préfixés par le groupe (lowThresholdDb, midBypass, crossoverLowMidFreq...)."
      additionalProperties: false
      required: [low, mid, high, crossover]
      properties:
        low: { $ref: '#/components/schemas/CompBand' }
        mid: { $ref: '#/components/schemas/CompBand' }
        high: { $ref: '#/components/schemas/CompBand' }
        crossover: { $ref: '#/components/schemas/Crossover' }
    Output:
      type: object
      additionalProperties: false
      required: [mix, eq, infraHpf, sideHpf, clipper, limiter, compressor]
      properties:
        mix: { $ref: '#/components/schemas/OutputMix' }
        eq: { $ref: '#/components/schemas/OutputEq' }
        infraHpf: { $ref: '#/components/schemas/InfraHpf' }
        sideHpf: { $ref: '#/components/schemas/SideHpf' }
        clipper: { $ref: '#/components/schemas/Clipper' }
        limiter: { $ref: '#/components/schemas/Limiter' }
        compressor: { $ref: '#/components/schemas/OutputCompressor' }
    SourceMix:
      type: object
      description: "Étage mix de source : fader, envoi Cue, répartition stéréo (Pan2 pour la largeur 1, Balance2 pour 2, Splay puis Balance2 pour 3 et plus). Contrôles de la SynthDef mx_mix_<largeur> : champ seul."
      additionalProperties: false
      required: [volume, cue, mute, balance, panLevel, balanceLevel, spread, splayLevel, center, levelComp, controlLag]
      properties:
        volume: { type: number, minimum: 0, maximum: 1, default: 1, description: "Niveau du fader (amplitude 0..1), appliqué avant la répartition stéréo." }
        cue: { type: number, minimum: 0, maximum: 1, default: 0, description: "Niveau d'envoi vers le bus Cue (0..1)." }
        mute: { type: boolean, default: false, description: "Coupe la source : niveau = volume × (1 - mute)." }
        balance: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "Position 0..1 (0.5 = centre) convertie en pos = balance × 2 - 1 : Pan2.pos (largeur 1), Balance2.pos (largeurs 2 et plus)." }
        panLevel: { type: number, minimum: 0, maximum: 2, default: 1, description: "Pan2.level (largeur 1 uniquement ; Pan2.schelp : « A control rate level input »)." }
        balanceLevel: { type: number, minimum: 0, maximum: 2, default: 1, description: "Balance2.level (largeurs 2 et plus ; Balance2.schelp : « a control rate level input »)." }
        spread: { type: number, minimum: 0, maximum: 1, default: 1, description: "Splay.spread (largeurs 3 et plus) : 0 = tous les canaux au centre, 1 = distribution maximale." }
        splayLevel: { type: number, minimum: 0, maximum: 2, default: 1, description: "Splay.level (largeurs 3 et plus) : multiplicateur d'amplitude de tous les canaux." }
        center: { type: number, minimum: -1, maximum: 1, default: 0, description: "Splay.center (largeurs 3 et plus) : décalage du centre de la distribution, -1..1." }
        levelComp: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "Splay.levelComp en valeur numérique (largeurs 3 et plus) : 0 = aucune compensation, 0.5 = puissance égale (défaut, équivalent de true en débit audio), 1 = amplitude égale." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    SourceInput:
      type: object
      description: "Étage input : SoundIn et gain. Porté par la SynthDef mx_in_<largeur> avec inputCompressor : contrôles préfixés (inputGain, inputMul, inputAdd, inputControlLag)."
      additionalProperties: false
      required: [gain, mul, add, controlLag]
      properties:
        gain: { type: number, minimum: 0, maximum: 1, default: 1, description: "Gain 0..1 appliqué après le compresseur d'entrée." }
        mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "SoundIn.mul : multiplicateur de sortie de l'UGen (SoundIn.schelp)." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "SoundIn.add : valeur ajoutée à la sortie de l'UGen (SoundIn.schelp)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    CompBand:
      type: object
      description: "Compresseur Compander complet : inputCompressor (contrôles préfixés inputCompressor<Champ>) et chaque bande de bandCompressor (contrôles préfixés low, mid, high : lowThresholdDb...). Arguments de Compander.schelp : thresh, slopeBelow, slopeAbove, clampTime, relaxTime, mul, add. Le signal de contrôle est le maximum des valeurs absolues des canaux (compression liée) : il porte le signal, ce n'est pas un paramètre."
      additionalProperties: false
      required: [thresholdDb, slopeBelow, slopeAbove, attackMs, releaseMs, mul, add, bypass, controlLag]
      properties:
        thresholdDb: { type: number, minimum: -80, maximum: 0, default: -20, description: "Seuil en dB : Compander.thresh = dbamp(thresholdDb) (Compander.schelp : thresh)." }
        slopeBelow: { type: number, minimum: 0.05, maximum: 10, default: 1, description: "Compander.slopeBelow : pente sous le seuil (1 = inchangé ; supérieure à 1 = expanseur ou porte)." }
        slopeAbove: { type: number, minimum: 0.05, maximum: 10, default: 0.25, description: "Compander.slopeAbove : pente au-dessus du seuil (inférieure à 1 = compression, 0.25 = 4:1 ; supérieure à 1 = expansion). Remplace l'ancien ratio (slopeAbove = 1 / ratio)." }
        attackMs: { type: number, minimum: 1, maximum: 100, default: 10, description: "Compander.clampTime = attackMs / 1000 (Compander.schelp : clampTime)." }
        releaseMs: { type: number, minimum: 10, maximum: 1000, default: 100, description: "Compander.relaxTime = releaseMs / 1000 (Compander.schelp : relaxTime)." }
        mul: { type: number, minimum: 0, maximum: 16, default: 1, description: "Compander.mul : multiplicateur de sortie de l'UGen. Remplace l'ancien makeupDb (mul = dbamp(makeupDb)), appliqué dans l'UGen et non plus par un étage de gain séparé." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "Compander.add : valeur ajoutée à la sortie de l'UGen (Compander.schelp)." }
        bypass: { type: boolean, default: true, description: "Select.which : true = signal non compressé (la bande ou le compresseur est contourné)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    SourceEq:
      type: object
      description: "EQ trois bandes de source : BLowShelf, BPeakEQ, BHiShelf. Contrôles de la SynthDef mx_eq_<largeur> : champ seul. Exactement neutre (low = mid = high = 0.5, mul = 1, add = 0) : SynthDef mx_eqdirect_<largeur> sans UGen d'égalisation. Entrer dans cet état ou en sortir recrée le Synth de l'étage : le changement est immédiat et ne passe pas par controlLag (sans effet au défaut 0)."
      additionalProperties: false
      required: [low, mid, high, rangeDb, lowFreq, lowRs, lowMul, lowAdd, midFreq, midRq, midMul, midAdd, highFreq, highRs, highMul, highAdd, controlLag]
      properties:
        low: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "BLowShelf.db en position 0..1 : db = (low × 2 - 1) × rangeDb (0.5 = 0 dB)." }
        mid: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "BPeakEQ.db en position 0..1 : db = (mid × 2 - 1) × rangeDb (0.5 = 0 dB)." }
        high: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "BHiShelf.db en position 0..1 : db = (high × 2 - 1) × rangeDb (0.5 = 0 dB)." }
        rangeDb: { type: number, minimum: 0, maximum: 24, default: 12, description: "Étendue en dB de la position 0..1 : ± rangeDb." }
        lowFreq: { type: number, minimum: 20, maximum: 20000, default: 80, description: "BLowShelf.freq en Hz (défaut 80 pour une source)." }
        lowRs: { type: number, minimum: 0.1, maximum: 10, default: 0.5, description: "BLowShelf.rs (inverse de la pente S du plateau)." }
        lowMul: { type: number, minimum: 0, maximum: 4, default: 1, description: "BLowShelf.mul : multiplicateur de sortie de l'UGen (BLowShelf.schelp)." }
        lowAdd: { type: number, minimum: -1, maximum: 1, default: 0, description: "BLowShelf.add : valeur ajoutée à la sortie de l'UGen (BLowShelf.schelp)." }
        midFreq: { type: number, minimum: 20, maximum: 20000, default: 1000, description: "BPeakEQ.freq en Hz." }
        midRq: { type: number, minimum: 0.05, maximum: 10, default: 0.7, description: "BPeakEQ.rq (inverse de Q)." }
        midMul: { type: number, minimum: 0, maximum: 4, default: 1, description: "BPeakEQ.mul : multiplicateur de sortie de l'UGen (BPeakEQ.schelp)." }
        midAdd: { type: number, minimum: -1, maximum: 1, default: 0, description: "BPeakEQ.add : valeur ajoutée à la sortie de l'UGen (BPeakEQ.schelp)." }
        highFreq: { type: number, minimum: 20, maximum: 20000, default: 8000, description: "BHiShelf.freq en Hz." }
        highRs: { type: number, minimum: 0.1, maximum: 10, default: 0.5, description: "BHiShelf.rs (inverse de la pente S du plateau)." }
        highMul: { type: number, minimum: 0, maximum: 4, default: 1, description: "BHiShelf.mul : multiplicateur de sortie de l'UGen (BHiShelf.schelp)." }
        highAdd: { type: number, minimum: -1, maximum: 1, default: 0, description: "BHiShelf.add : valeur ajoutée à la sortie de l'UGen (BHiShelf.schelp)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    Hp:
      type: object
      description: "Passe-haut de source. Champs applicables par modèle : BHiPass et BHiPass4 : enabled, freq, minHz, maxHz, q, mul, add, controlLag ; RHPF : les mêmes et floorHz. Les champs non applicables au modèle chargé sont mémorisés et ignorés. Contrôles : champ seul."
      additionalProperties: false
      required: [enabled, model, freq, minHz, maxHz, q, mul, add, floorHz, controlLag]
      properties:
        enabled: { type: boolean, default: false, description: "Mélange sec/filtré : 0 = signal sec, 1 = signal filtré (lissé par controlLag)." }
        model: { type: string, enum: [BHiPass, RHPF, BHiPass4], default: BHiPass, description: "Modèle de filtre : choisit la SynthDef (BHiPass, RHPF ou BHiPass4) ; un changement de modèle remplace le Synth (opération de structure)." }
        freq: { type: number, minimum: 0, maximum: 1, default: 0, description: "Position 0..1 convertie en fréquence : freq = linexp(position, 0, 1, minHz, maxHz) (UGen.freq)." }
        minHz: { type: number, minimum: 20, maximum: 20000, default: 20, description: "Fréquence (Hz) de la position 0 de freq." }
        maxHz: { type: number, minimum: 20, maximum: 20000, default: 20000, description: "Fréquence (Hz) de la position 1 de freq ; doit dépasser minHz." }
        q: { type: number, minimum: 0.5, maximum: 10, default: 1, description: "Facteur de qualité : rq = 1 / q (BHiPass.rq, RHPF.rq, BHiPass4.rq ; tous modèles)." }
        mul: { type: number, minimum: 0, maximum: 2, default: 1, description: "UGen.mul du filtre du modèle chargé (tous modèles)." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "UGen.add du filtre du modèle chargé (tous modèles)." }
        floorHz: { type: number, minimum: 20, maximum: 20000, default: 40, description: "RHPF seulement : plancher de fréquence en Hz (freq = max(freq, floorHz)) ; sans effet pour BHiPass et BHiPass4." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    Lp:
      type: object
      description: "Passe-bas de source. Champs applicables par modèle : BLowPass, RLPF et BLowPass4 : enabled, freq, minHz, maxHz, q, mul, add, controlLag ; MoogFF : enabled, freq, minHz, maxHz, gain, mul, add, controlLag (et le déclencheur reset de POST .../lp/reset-state). Les champs non applicables au modèle chargé sont mémorisés et ignorés."
      additionalProperties: false
      required: [enabled, model, freq, minHz, maxHz, q, gain, mul, add, controlLag]
      properties:
        enabled: { type: boolean, default: false, description: "Mélange sec/filtré : 0 = signal sec, 1 = signal filtré (lissé par controlLag)." }
        model: { type: string, enum: [BLowPass, RLPF, BLowPass4, MoogFF], default: BLowPass, description: "Modèle de filtre : choisit la SynthDef (BLowPass, RLPF, BLowPass4 ou MoogFF) ; un changement de modèle remplace le Synth (opération de structure)." }
        freq: { type: number, minimum: 0, maximum: 1, default: 1, description: "Position 0..1 convertie en fréquence : freq = linexp(position, 0, 1, minHz, maxHz) (UGen.freq)." }
        minHz: { type: number, minimum: 20, maximum: 20000, default: 20, description: "Fréquence (Hz) de la position 0 de freq." }
        maxHz: { type: number, minimum: 20, maximum: 20000, default: 20000, description: "Fréquence (Hz) de la position 1 de freq ; doit dépasser minHz." }
        q: { type: number, minimum: 0.5, maximum: 10, default: 1, description: "Facteur de qualité : rq = 1 / q (BLowPass, RLPF, BLowPass4 ; sans effet pour MoogFF)." }
        gain: { type: number, minimum: 0, maximum: 4, default: 2, description: "MoogFF seulement : MoogFF.gain, résonance entre 0 et 4 (MoogFF.schelp) ; sans effet pour les autres modèles." }
        mul: { type: number, minimum: 0, maximum: 2, default: 1, description: "UGen.mul du filtre du modèle chargé (tous modèles)." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "UGen.add du filtre du modèle chargé (tous modèles)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    Pitch:
      type: object
      description: "Transposition PitchShift suivie d'un XFade2 entre signal direct et signal transposé. windowSize est le seul champ fixé à la création du UGen."
      additionalProperties: false
      required: [semitones, blend, level, windowSize, pitchDispersion, timeDispersion, mul, add, controlLag]
      properties:
        semitones: { type: integer, minimum: -12, maximum: 12, default: 0, description: "Transposition entière en demi-tons : pitchRatio = midiratio(semitones), soit 0.5 à 2 pour -12..12 (PitchShift.schelp : pitchRatio entre 0 et 4)." }
        blend: { type: number, minimum: -1, maximum: 1, default: -1, description: "XFade2.pan : -1 = signal direct sans PitchShift (défaut), 1 = signal transposé ; valeurs intermédiaires = mélange. Remplace la sélection automatique « semitones différent de 0 »." }
        level: { type: number, minimum: 0, maximum: 2, default: 1, description: "XFade2.level (XFade2.schelp : « A control rate level input »)." }
        windowSize: { type: number, minimum: 0.01, maximum: 0.2, default: 0.2, description: "PitchShift.windowSize en secondes. Argument fixé à la création du UGen (PitchShift.schelp : « cannot be modulated ») : un changement recrée le Synth de l'étage. Borne maximale = dimensionnement de memSize (PITCH_WINDOW_MAX_SECONDS)." }
        pitchDispersion: { type: number, minimum: 0, maximum: 1, default: 0, description: "PitchShift.pitchDispersion : écart aléatoire maximal autour du rapport de hauteur." }
        timeDispersion: { type: number, minimum: 0, maximum: 0.2, default: 0.01, description: "PitchShift.timeDispersion en secondes (PitchShift.schelp : au plus windowSize)." }
        mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "PitchShift.mul : multiplicateur de sortie de l'UGen (PitchShift.schelp)." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "PitchShift.add : valeur ajoutée à la sortie de l'UGen (PitchShift.schelp)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    Crossover:
      type: object
      description: "Filtres de répartition LR4 du compresseur trois bandes (cascades de deux LPF ou HPF identiques, PUT .../bandCompressor/crossover). Contrôles préfixés crossover<Champ> : crossoverLowMidFreq, crossoverLowLp1Mul..."
      additionalProperties: false
      required: [lowMidFreq, midHighFreq, controlLag, lowLp1Mul, lowLp1Add, lowLp2Mul, lowLp2Add, midHp1Mul, midHp1Add, midHp2Mul, midHp2Add, midLp1Mul, midLp1Add, midLp2Mul, midLp2Add, highHp1Mul, highHp1Add, highHp2Mul, highHp2Add]
      properties:
        lowMidFreq: { type: number, minimum: 20, maximum: 20000, default: 250, description: "Fréquence de répartition grave/médium (Hz) : freq des filtres LPF de la bande grave et HPF de la bande médium (cascades LR4 : deux UGens identiques)." }
        midHighFreq: { type: number, minimum: 20, maximum: 20000, default: 4000, description: "Fréquence de répartition médium/aigu (Hz) : freq des filtres LPF de la bande médium et HPF de la bande aiguë ; doit dépasser lowMidFreq." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
        lowLp1Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 1 (sur 2) de la cascade LR4 : LPF de la bande grave (LPF.mul ou HPF.mul)." }
        lowLp1Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 1 (sur 2) de la cascade LR4 : LPF de la bande grave (LPF.add ou HPF.add)." }
        lowLp2Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 2 (sur 2) de la cascade LR4 : LPF de la bande grave (LPF.mul ou HPF.mul)." }
        lowLp2Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 2 (sur 2) de la cascade LR4 : LPF de la bande grave (LPF.add ou HPF.add)." }
        midHp1Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 1 (sur 2) de la cascade LR4 : HPF de la bande médium (LPF.mul ou HPF.mul)." }
        midHp1Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 1 (sur 2) de la cascade LR4 : HPF de la bande médium (LPF.add ou HPF.add)." }
        midHp2Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 2 (sur 2) de la cascade LR4 : HPF de la bande médium (LPF.mul ou HPF.mul)." }
        midHp2Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 2 (sur 2) de la cascade LR4 : HPF de la bande médium (LPF.add ou HPF.add)." }
        midLp1Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 1 (sur 2) de la cascade LR4 : LPF de la bande médium (LPF.mul ou HPF.mul)." }
        midLp1Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 1 (sur 2) de la cascade LR4 : LPF de la bande médium (LPF.add ou HPF.add)." }
        midLp2Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 2 (sur 2) de la cascade LR4 : LPF de la bande médium (LPF.mul ou HPF.mul)." }
        midLp2Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 2 (sur 2) de la cascade LR4 : LPF de la bande médium (LPF.add ou HPF.add)." }
        highHp1Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 1 (sur 2) de la cascade LR4 : HPF de la bande aiguë (LPF.mul ou HPF.mul)." }
        highHp1Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 1 (sur 2) de la cascade LR4 : HPF de la bande aiguë (LPF.add ou HPF.add)." }
        highHp2Mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "mul du UGen 2 (sur 2) de la cascade LR4 : HPF de la bande aiguë (LPF.mul ou HPF.mul)." }
        highHp2Add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du UGen 2 (sur 2) de la cascade LR4 : HPF de la bande aiguë (LPF.add ou HPF.add)." }
    OutputMix:
      type: object
      description: "Étage mix de sortie : volume avant le compresseur. Contrôles préfixés (mixVolume, mixControlLag)."
      additionalProperties: false
      required: [volume, controlLag]
      properties:
        volume: { type: number, minimum: 0, maximum: 1, default: 1, description: "Niveau de la sortie (amplitude 0..1), appliqué avant l'écrêteur, le limiteur et le compresseur." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    OutputEq:
      type: object
      description: "EQ trois bandes de sortie (mêmes arguments que SourceEq, fréquence grave 200 Hz par défaut). Contrôles préfixés (eqLow, eqLowFreq...)."
      additionalProperties: false
      required: [low, mid, high, rangeDb, lowFreq, lowRs, lowMul, lowAdd, midFreq, midRq, midMul, midAdd, highFreq, highRs, highMul, highAdd, controlLag]
      properties:
        low: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "BLowShelf.db en position 0..1 : db = (low × 2 - 1) × rangeDb (0.5 = 0 dB)." }
        mid: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "BPeakEQ.db en position 0..1 : db = (mid × 2 - 1) × rangeDb (0.5 = 0 dB)." }
        high: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "BHiShelf.db en position 0..1 : db = (high × 2 - 1) × rangeDb (0.5 = 0 dB)." }
        rangeDb: { type: number, minimum: 0, maximum: 24, default: 12, description: "Étendue en dB de la position 0..1 : ± rangeDb." }
        lowFreq: { type: number, minimum: 20, maximum: 20000, default: 200, description: "BLowShelf.freq en Hz (défaut 200 pour une sortie)." }
        lowRs: { type: number, minimum: 0.1, maximum: 10, default: 0.5, description: "BLowShelf.rs (inverse de la pente S du plateau)." }
        lowMul: { type: number, minimum: 0, maximum: 4, default: 1, description: "BLowShelf.mul : multiplicateur de sortie de l'UGen (BLowShelf.schelp)." }
        lowAdd: { type: number, minimum: -1, maximum: 1, default: 0, description: "BLowShelf.add : valeur ajoutée à la sortie de l'UGen (BLowShelf.schelp)." }
        midFreq: { type: number, minimum: 20, maximum: 20000, default: 1000, description: "BPeakEQ.freq en Hz." }
        midRq: { type: number, minimum: 0.05, maximum: 10, default: 0.7, description: "BPeakEQ.rq (inverse de Q)." }
        midMul: { type: number, minimum: 0, maximum: 4, default: 1, description: "BPeakEQ.mul : multiplicateur de sortie de l'UGen (BPeakEQ.schelp)." }
        midAdd: { type: number, minimum: -1, maximum: 1, default: 0, description: "BPeakEQ.add : valeur ajoutée à la sortie de l'UGen (BPeakEQ.schelp)." }
        highFreq: { type: number, minimum: 20, maximum: 20000, default: 8000, description: "BHiShelf.freq en Hz." }
        highRs: { type: number, minimum: 0.1, maximum: 10, default: 0.5, description: "BHiShelf.rs (inverse de la pente S du plateau)." }
        highMul: { type: number, minimum: 0, maximum: 4, default: 1, description: "BHiShelf.mul : multiplicateur de sortie de l'UGen (BHiShelf.schelp)." }
        highAdd: { type: number, minimum: -1, maximum: 1, default: 0, description: "BHiShelf.add : valeur ajoutée à la sortie de l'UGen (BHiShelf.schelp)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    InfraHpf:
      type: object
      description: "Passe-haut infrasonore de sortie (HPF.ar : freq, mul, add)."
      additionalProperties: false
      required: [enabled, hz, mul, add, controlLag]
      properties:
        enabled: { type: boolean, default: false, description: "Mélange sec/filtré du passe-haut infrasonore (0 = désactivé)." }
        hz: { type: number, minimum: 20, maximum: 200, default: 25, description: "HPF.freq en Hz." }
        mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "HPF.mul : multiplicateur de sortie de l'UGen (HPF.schelp)." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "HPF.add : valeur ajoutée à la sortie de l'UGen (HPF.schelp)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    SideHpf:
      type: object
      description: "Passe-haut du canal latéral de sortie (HPF.ar : freq, mul, add)."
      additionalProperties: false
      required: [enabled, hz, mul, add, controlLag]
      properties:
        enabled: { type: boolean, default: false, description: "Mélange sec/filtré du passe-haut appliqué au canal latéral (0 = désactivé)." }
        hz: { type: number, minimum: 20, maximum: 1000, default: 100, description: "HPF.freq en Hz (canal latéral)." }
        mul: { type: number, minimum: 0, maximum: 4, default: 1, description: "HPF.mul : multiplicateur de sortie de l'UGen (HPF.schelp)." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "HPF.add : valeur ajoutée à la sortie de l'UGen (HPF.schelp)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    Clipper:
      type: object
      description: "Écrêteur de sortie (Clip.ar : lo, hi)."
      additionalProperties: false
      required: [enabled, lo, hi, controlLag]
      properties:
        enabled: { type: boolean, default: false, description: "Mélange sec/écrêté (0 = désactivé)." }
        lo: { type: number, minimum: -4, maximum: 4, default: -1, description: "Clip.lo : seuil bas (amplitude) ; doit être inférieur à hi (Clip.schelp). Remplace l'ancien ceilingDb (lo = -dbamp(ceilingDb))." }
        hi: { type: number, minimum: -4, maximum: 4, default: 1, description: "Clip.hi : seuil haut (amplitude) ; doit dépasser lo. Remplace l'ancien ceilingDb (hi = dbamp(ceilingDb))." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    Limiter:
      type: object
      description: "Limiteur de sortie (Limiter.ar : level, dur)."
      additionalProperties: false
      required: [enabled, ceilingDb, durMs, controlLag]
      properties:
        enabled: { type: boolean, default: false, description: "Mélange sec/limité (0 = désactivé)." }
        ceilingDb: { type: number, minimum: -24, maximum: 0, default: -1, description: "Limiter.level = dbamp(ceilingDb) : niveau de crête de sortie (Limiter.schelp : level)." }
        durMs: { type: number, minimum: 1, maximum: 50, default: 10, description: "Limiter.dur = durMs / 1000 : durée d'anticipation. Argument fixé à la création du UGen (Limiter.schelp : « cannot be modulated ») : un changement bascule vers un nouveau Synth avec fondu. Borne maximale = dimensionnement de memSize (LIMITER_DUR_MAX_MS)." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
    OutputCompressor:
      type: object
      description: "Compresseur de sortie, dernier étage audio. Champs communs aux trois modèles (Compander, CompanderD, FaustRMS)."
      additionalProperties: false
      required: [model, thresholdDb, slopeBelow, slopeAbove, attackMs, releaseMs, mul, add, bypass, controlLag, fadeSeconds]
      properties:
        model: { type: string, enum: [Compander, CompanderD, FaustRMS], default: Compander, description: "Modèle de compresseur : choisit la SynthDef (Compander, CompanderD ou FaustRMS) ; un changement de modèle bascule vers un nouveau Synth avec fondu. Indisponible : 409 MODEL_UNAVAILABLE." }
        thresholdDb: { type: number, minimum: -80, maximum: 0, default: -20, description: "Seuil en dB : thresh = dbamp(thresholdDb) pour Compander et CompanderD ; en dB tel quel pour FaustRMS." }
        slopeBelow: { type: number, minimum: 0.05, maximum: 10, default: 1, description: "slopeBelow du modèle (Compander.schelp : 1 = inchangé)." }
        slopeAbove: { type: number, minimum: 0.05, maximum: 10, default: 0.25, description: "slopeAbove du modèle (inférieure à 1 = compression, 0.25 = 4:1)." }
        attackMs: { type: number, minimum: 1, maximum: 100, default: 10, description: "clampTime = attackMs / 1000 (Compander, CompanderD) ; en ms pour FaustRMS. CompanderD : le délai du DelayN interne suit attackMs, borné à 100 ms." }
        releaseMs: { type: number, minimum: 10, maximum: 1000, default: 100, description: "relaxTime = releaseMs / 1000 (Compander, CompanderD) ; en ms pour FaustRMS." }
        mul: { type: number, minimum: 0, maximum: 16, default: 1, description: "mul du modèle (Compander.mul, CompanderD.mul ; multiplication de la sortie pour FaustRMS)." }
        add: { type: number, minimum: -1, maximum: 1, default: 0, description: "add du modèle (Compander.add, CompanderD.add ; addition à la sortie pour FaustRMS)." }
        bypass: { type: boolean, default: true, description: "Select.which : true = signal non compressé." }
        controlLag: { type: number, minimum: 0, maximum: 2, default: 0, description: "Temps de lissage en secondes des contrôles continus de l'étage (Lag.kr, Lag.schelp : lagTime). 0 = application immédiate (défaut : aucun lissage, décision du 05/11)." }
        fadeSeconds: { type: number, minimum: 0.005, maximum: 2, default: 0.05, description: "VarLag.time de l'écrivain de sortie : durée en secondes du fondu entre deux Synths lors d'un changement de modèle ou d'un argument fixé à la création (compressor.model, limiter.durMs)." }
    GraphStage:
      type: object
      required: [stage, enabled, requestedModel, loadedModel]
      properties:
        stage: { type: string, enum: [infraHpf, sideHpf, eq, mix, clipper, limiter, compressor] }
        enabled: { type: boolean }
        requestedModel: { type: [string, 'null'] }
        loadedModel: { type: [string, 'null'] }
    SourceMeter:
      type: object
      required: [sourceId, peakDb, rmsDb]
      properties:
        sourceId: { type: string }
        peakDb: { type: number }
        rmsDb: { type: number }
    OutputMeter:
      type: object
      required: [output, channel, peakDb, rmsDb]
      properties:
        output: { type: string, enum: [master, cue] }
        channel: { type: string, enum: [left, right] }
        peakDb: { type: number }
        rmsDb: { type: number }
